<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Page Not Found | Demilade Somide</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/project-page.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--body);
            background: linear-gradient(135deg, var(--off-white) 0%, var(--cool-ice) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-code {
            font-family: var(--display);
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 600;
            color: var(--deep-navy);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.15;
        }
        h1 {
            font-family: var(--display);
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--deep-navy);
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 1.75rem;
            font-family: var(--body);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            background: var(--cool-slate);
            color: var(--on-accent);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--panel-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>Looks like this page got lost in the data pipeline.</p>
    <a href="index.html" class="btn">← Back to Home</a>
</body>
</html>
